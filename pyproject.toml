[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gplanner"
version = "0.0.1"
description = "Keeps a Notion planner in sync with a Genshin Impact account."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Exact pin: genshin.py tracks unofficial APIs and releases monthly. Bump it on
    # purpose and re-check the methods hoyolab/client.py uses.
    "genshin==1.7.32",
    # Speaks Notion API 2025-09-03 (data sources) and retries 429s itself.
    "notion-client==3.1.0",
    "python-dotenv>=1.0",
    # Windows has no system time zone database, so zoneinfo needs this.
    "tzdata>=2024.1",
]

[project.scripts]
gplanner = "gplanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gplanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls real external APIs; skipped unless run on purpose with -m live",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ"]
